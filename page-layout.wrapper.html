<div class="map-page">
  <div class="map-page__container">
    <header class="map-page__header">
      <div class="map-page__badge">
        <p class="map-page__eyebrow">SGS e-Customs</p>
      </div>
      <h1 class="map-page__title">European customs coverage</h1>
      <p class="map-page__subtitle">Explore transit, brokerage, and export services across our network. Hover or tap a country to view details.</p>
    </header>
    <section class="map-page__card" aria-label="Interactive coverage map">
      <div class="map-page__card-inner">
        <div class="map-page__stage">
          <nav class="map-legend" aria-label="Service types">
            <span class="map-legend__pill map-legend__pill--transit">
              <span class="map-legend__dot" aria-hidden="true"></span>
              Transit
            </span>
            <span class="map-legend__pill map-legend__pill--brokerage">
              <span class="map-legend__dot" aria-hidden="true"></span>
              Transit + Brokerage
            </span>
            <span class="map-legend__pill map-legend__pill--export">
              <span class="map-legend__dot" aria-hidden="true"></span>
              Transit + Export
            </span>
          </nav>
          {{MAP}}
        </div>
      </div>
    </section>
  </div>
</div>
